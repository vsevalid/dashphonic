name: Release

# Тег vX.Y.Z → подписанный APK в GitHub Releases; приложение находит его через releases/latest
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $TAG"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then echo "::error::Minor and patch must be below 100"; exit 1; fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 34
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-34' 'build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.2.1'

      - name: Panel tests
        run: node --test tests/*.test.cjs

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DASHPHONIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the DASHPHONIC_KEYSTORE_* secrets first: scripts/create-release-key.sh prints the commands"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DASHPHONIC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signed release APK
        env:
          DASHPHONIC_KEYSTORE_PASSWORD: ${{ secrets.DASHPHONIC_KEYSTORE_PASSWORD }}
          DASHPHONIC_KEY_ALIAS: ${{ secrets.DASHPHONIC_KEY_ALIAS }}
          DASHPHONIC_KEY_PASSWORD: ${{ secrets.DASHPHONIC_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          cp "$APK" "dashphonic-${{ steps.version.outputs.name }}.apk"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dashphonic-${{ steps.version.outputs.name }}.apk" --title "Dashphonic ${{ steps.version.outputs.name }}" --generate-notes --verify-tag

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
